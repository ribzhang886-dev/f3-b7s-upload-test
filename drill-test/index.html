function cloudQueueStatus(d){
 const ids=new Set((d.archives||[]).map(x=>x.archiveId));
 const q=d.cloudPending||[];
 return {pending:q.filter(x=>ids.has(x.archiveId)).length, missing:q.filter(x=>!ids.has(x.archiveId)).length};
}
function cloudQueueInfo(){

const BRIDGE_URL='http://127.0.0.1:8765';let bridgeToken='',bridgeMessage='尚未配對';let bridgeBusy=false;
function pairBridge(){bridgeToken=$('bridgeToken')?.value.trim()||'';if(!bridgeToken){alert('請輸入配對碼');return}syncBridge()}
async function bridgeCall(path,method='GET',body=null){let response=await fetch(BRIDGE_URL+path,{method,headers:{'X-V39-Token':bridgeToken,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});let data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'橋接錯誤 '+response.status);return data}
async function syncBridge(){if(!bridgeToken||bridgeBusy)return;bridgeBusy=true;try{
 let d=stored(),pending=[...(d.cloudPending||[])];
 for(const item of pending){let a=(d.archives||[]).find(x=>x.archiveId===item.archiveId);if(!a)continue;
 let response=await bridgeCall('/archive','POST',{archiveId:a.archiveId,snapshot:a.snapshot,createdAt:a.createdAt});
 if(!response.locallyQueued)throw Error('Python 未確認接收');
 }
 let status=await bridgeCall('/status');let confirmed=new Set(status.confirmed||[]);
 d=stored();d.cloudConfirmed=d.cloudConfirmed||{};
 for(const item of d.cloudPending||[]){if(confirmed.has(item.archiveId))d.cloudConfirmed[item.archiveId]=new Date().toISOString()}
 d.cloudPending=(d.cloudPending||[]).filter(x=>!confirmed.has(x.archiveId));
 localStorage.setItem(SKEY,JSON.stringify(d));
 bridgeMessage=`本機橋接已配對；Python 待上傳 ${status.archiveQueued} 筆；Google 已確認 ${status.archiveSynced} 筆${status.lastError?'；同步異常：'+status.lastError:''}`;
 }catch(e){bridgeMessage='尚未確認雲端：'+e.message}finally{bridgeBusy=false;if(view==='menu')menu()}
}
setInterval(()=>{if(bridgeToken)syncBridge()},7000);

// Determine logical branch ancestry from the workbook's directed card graph,
// not from navigation history. A card before the first branch never points forward.
function logicalParents(){
 const parents={};
 const add=(from,to)=>{if(!cards[String(from)]||!cards[String(to)])return;(parents[String(to)]??=[]).push(String(from))};
 for(const c of DATA['卡片']){
  const from=String(c.CardID);
  if(c.NextCardID)add(from,c.NextCardID);
  if(c.MergeCardID)add(from,c.MergeCardID);
  const seg=segments[String(c.SegmentID)];
  if(!c.NextCardID&&!c.MergeCardID&&seg?.NextSegmentID&&segments[String(seg.NextSegmentID)])add(from,segments[String(seg.NextSegmentID)].StartCardID);
 }
 for(const b of branches)add(b.SourceCardID,b.TargetCardID);
 return parents;
}
function logicalBranchAncestor(cid){
 const parents=logicalParents(),seen=new Set([String(cid)]),queue=[String(cid)];
 while(queue.length){
  const cur=queue.shift();
  for(const parent of parents[cur]||[]){
   if(seen.has(parent))continue;
   seen.add(parent);
   if(cards[parent]?.CardType==='BRANCH')return parent;
   queue.push(parent);
  }
 }
 return null;
}

function finish(aborted){

function confirmFormalFinish(aborted,removeProgress){
 if(archiveView||!session||session.mode!=='formal'||session.status!=='ongoing')return;
 if(!aborted&&unfinishedCards().length){alert('尚有未完成題目，不能結束並封存。');return}
 const a=$('finishEvaluatee')?.value.trim()||'',b=$('finishEvaluator')?.value.trim()||'',u=$('finishUnit')?.value.trim()||'';
 if(!a||!b||!u){alert('請完整填寫受評人員員工代號、評核人員員工代號及單位。');return}
 const createdAt=now(),archiveId='ARCH-'+id(),snapshot=JSON.parse(JSON.stringify({...session,evaluatee:a,evaluator:b,unit:u,status:aborted?'aborted':'finished',endedAt:createdAt}));
 try{
  const d=stored();d.sessions=d.sessions||[];d.archives=d.archives||[];
  if(d.archives.some(x=>x.archiveId===archiveId))throw Error('封存識別碼重複');
  d.archives.push({archiveId,createdAt,snapshot});
  // Keep the cloud-intended archive ID in the same atomic localStorage write.
  // F3-B1 does NOT send personal data to any service.
  d.cloudPending=d.cloudPending||[];
  if(!d.cloudPending.some(x=>x.archiveId===archiveId))d.cloudPending.push({archiveId,queuedAt:createdAt});
  // Only evaluator and unit persist across distinct formal assessments.
  // Evaluatee is retained exclusively in the ongoing session when progress is kept.
  d.lastFormalIdentity={evaluator:b,unit:u};
  if(removeProgress){d.sessions=d.sessions.filter(x=>x.id!==session.id)}
  else {const work=JSON.parse(JSON.stringify({...session,evaluatee:a,evaluator:b,unit:u,status:'ongoing'}));const i=d.sessions.findIndex(x=>x.id===session.id);if(i>=0)d.sessions[i]=work;else d.sessions.push(work)}
  localStorage.setItem(SKEY,JSON.stringify(d));
  if(bridgeToken)syncBridge();
  if(removeProgress){session=snapshot;archiveView=true;menu()}
  else{Object.assign(session,{evaluatee:a,evaluator:b,unit:u});menu();alert('中止紀錄已封存於本機，工作進度仍保留，可於下次接續。')}
 }catch(e){alert('封存失敗，未刪除工作進度：'+e.message)}
}

function csvLine(a){return a.map(x=>'"'+csvCell(x).replace(/"/g,'""')+'"').join(',')}
function download(filename,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportCsv(){if(!session)return;if(session.mode==='formal'&&session.status!=='ongoing'){writeCsv();return}if(!session.evaluatee||!session.evaluator){$('app').innerHTML=`<div class="panel"><h2>匯出評核結果</h2><p>請填寫受評人員及評核人員資料，僅用於本次紀錄及檔名。</p><label>受評人員<input id="evaluatee" value="${esc(session.evaluatee)}"></label><label>評核人員<input id="evaluator" value="${esc(session.evaluator)}"></label><label>單位（選填）<input id="unit" value="${esc(session.unit)}"></label><button class="primary" onclick="confirmExport()">確認匯出 CSV</button><button onclick="results()">取消</button></div>`;return}writeCsv()}
function confirmExport(){if(session?.mode==='formal'&&session.status!=='ongoing'){alert('正式評核已封存，不可修改人員資料。');results();return}let a=$('evaluatee').value.trim(),b=$('evaluator').value.trim();if(!a||!b){alert('請填寫受評人員及評核人員');return}session.evaluatee=a;session.evaluator=b;session.unit=$('unit').value.trim();persist();writeCsv();results()}
function writeCsv(){let rows=[['EvaluationID','Mode','Status','Plan','Version','Evaluatee','Evaluator','Unit','StartedAt','EndedAt','CardID','CardTitle','QuestionSnapshot','Grade','Note','RatedAt'],...Object.entries(session.ratings).map(([cid,r])=>[session.id,session.mode,session.status,session.plan,session.version,session.evaluatee,session.evaluator,session.unit,session.startedAt,session.endedAt||'',cid,r.title,r.question,r.grade,r.note,r.at])];let stamp=session.startedAt.replace(/[-:TZ.]/g,'').slice(0,14),safe=s=>String(s||'未命名').replace(/[\\/:*?"<>|]/g,'_').slice(0,35);download(`${stamp}_${safe(session.plan)}_評核-${safe(session.evaluator)}_受評-${safe(session.evaluatee)}.csv`,'\ufeff'+rows.map(csvLine).join('\r\n'),'text/csv;charset=utf-8')}
function backup(){download('V3_進度備份_'+Date.now()+'.json',JSON.stringify({version:DATA.version,backupAt:now(),data:stored()},null,2),'application/json')}
function restoreBackup(event){let file=event.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(obj.version!==DATA.version)throw Error('題庫版本不一致，為避免紀錄錯置，不能直接匯入。');if(!obj.data||!Array.isArray(obj.data.sessions))throw Error('備份格式錯誤');if(!confirm('匯入將取代此版本在本瀏覽器的暫存資料（包含歷次封存與待同步佇列），可能造成封存資料遺失。請先備份目前資料，確定繼續？'))return;const current=stored();const protectedIds=new Set((current.archives||[]).map(a=>a.archiveId));const importedIds=new Set((obj.data.archives||[]).map(a=>a.archiveId));if([...protectedIds].some(x=>!importedIds.has(x)))throw Error('備份缺少現有正式封存紀錄，已拒絕覆蓋');const currentQueue=new Set((current.cloudPending||[]).map(a=>a.archiveId));const incomingQueue=new Set((obj.data.cloudPending||[]).map(a=>a.archiveId));if([...currentQueue].some(x=>!incomingQueue.has(x)))throw Error('備份缺少現有待同步紀錄，已拒絕覆蓋');localStorage.setItem(SKEY,JSON.stringify(obj.data));menu()}catch(e){alert('匯入失敗：'+e.message)}};reader.readAsText(file)}
function zoomImage(el){$('zoomimg').src=el.src;$('zoom').style.display='flex'}
menu();
</script></body></html>
