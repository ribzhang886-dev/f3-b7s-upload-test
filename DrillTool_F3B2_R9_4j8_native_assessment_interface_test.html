需要疏散時，如何決定優先順序與動線？","Answer":"依院內疏散計畫與現場指揮，優先保障人員安全。","Checkpoints":"患者風險；動線；人力協調。","OriginalCardID":"C10","SegmentName":"疏散與清點","StageName":"緊急疏散"},{"CardID":"C11","CardType":"QUESTION","Title":"疏散後清點","Question":"人員抵達安全區域後，如何完成清點與回報？","Answer":"依單位名冊清點，回報失聯及需協助者。","Checkpoints":"清點人員；異常通報；持續照護。","OriginalCardID":"C11","SegmentName":"疏散與清點","StageName":"緊急疏散"}],"groups":[{"GroupID":"G1","BranchCardID":"C02","MergeCardID":"C05","AutoMergeOnComplete":false,"Routes":[{"RouteID":"B01","SortOrder":1,"Title":"通報系統正常","NodeRefs":[{"type":"card","id":"C03"}]},{"RouteID":"B02","SortOrder":2,"Title":"通報系統故障","NodeRefs":[{"type":"card","id":"C04"}]}],"Title":"通報系統狀態"},{"GroupID":"G2","BranchCardID":"C07","MergeCardID":"C09","AutoMergeOnComplete":false,"Routes":[{"RouteID":"B03","SortOrder":1,"Title":"火勢可控制，繼續原流程","NodeRefs":[{"type":"card","id":"C08"}]}],"Title":"火勢變化"}],"root":[{"type":"card","id":"C01"},{"type":"group","id":"G1"},{"type":"card","id":"C06"},{"type":"group","id":"G2"},{"type":"card","id":"C10"},{"type":"card","id":"C11"}]},"shortAssessment":{"id":"F3B2-R92F-DEMO","version":"R9.2l-demo","cards":[{"CardID":"Q1","CardType":"QUESTION","Title":"發現異常","Question":"病房聞到焦味並看見煙霧，第一步如何處置？","Answer":"立即辨識危險、示警並依院內程序啟動應變。","Checkpoints":"確認現場安全；示警；啟動通報。","LearningURL":"https://www.python.org/downloads/release/pymanager-264/","LearningText":"測試","QuestionImageData":"data:image/gif;base64,R0lGODlh8ADwAIAAAAAAAAAAACH/C05FVFNDQVBFMi4wAwEAAAAh/gdnaWYuc2tpACH5BAkEAAAALAAAAADwAPAAhwAAAGI2KtC3mP///zJUn2A0KGAzJ18yJ9O6m14xJtW9nVssIGI1Kde/n9G4mV0wJV0vI1wvJGU5LdK5mlkqHVorH1wuISxQnmo/M14xJShMm2g9MWxCNXRMQM+2l6qLcmg6LnhPQG5FOHBHO5FtWfHu7KSDbPXy8ZyAeaqSi/j19MSpjJl8dOzn5n9XR3ZPRYJbSo1pVa6XkZh2YNK4mOHZ1/79/aCFfaeHb9i8mNvQzl8yJXpVSryppMyylIxsYy9SnodmXM2zkriagOjh4N/W1FsuI4VjWnJJPIZgTv38+4lkUc60k2AzKK6PdrWhm6aNhsqwkryghCpOnHuCnDVWn5x6ZPXx7e/q6ebf3XtTQ7qdgs61lXhSR6OJgZV3b7WYfbOVe2M2KFRpnqB/aINgVs7AvMesj9TIxbikn9nCoce3s8W1sOrk4sKmimY7L45vZvz7+nxYTopoX8m6tsOyrbKclpJ0a8mukdjNyoFdU5BxaNDCv/r5+N3U    }
   if(!Array.isArray(g.Routes)||!g.Routes.length)errors.push(gid+' 至少需要一條 Route');

  }

   if(guard>model.groups.size+3)throw Error('巢狀 Group 迴圈');

 function prevBPlan(){
  if(!state||state.review||!state.frames?.length)return null;
  const frames=dup(state.frames),cur=state.cursor;
  if(!['B','Q','M'].includes(cur?.type))return null;
  // At any M, its own B is the previous structural checkpoint.
  if(cur.type==='M'){
   const f=frames[frames.length-1];
   if(f.kind!=='group')return null;
   f.routeId=null;f.index=0;
   return {frames,cursor:{type:'B',id:groupMap.get(f.gid).BranchCardID,gid:f.gid}};
  }
  if(cur.type==='B'){
   // The current Group's entrance is not a *previous* checkpoint.
   if(frames.length<=1)return null;

  // A preceding Group is represented by its M (not by arbitrarily choosing
  // one of its incoming Routes). At the start of a nested Route, use its B.

    f.index=i;
    frames.push({kind:'group',gid:node.id,routeId:selected.RouteID,index:selected.NodeRefs.length});
    return {frames,cursor:{type:'M',id:g.MergeCardID,gid:node.id,routeId:selected.RouteID}};
   }
   if(f.kind==='group'){

   }

const R93T_NATIVE_COMPONENTS=(()=>{
  const copyAttr=(dst,src)=>{

  const prefix=(panel,src)=>{

  const setButtons=(dest,source)=>{

      const nav=panel.querySelector('.card-nav-actions');nav?.before(panelScore);
    }

      const e=extra.cloneNode(true);e.classList.add('r93t-engine-action');
      panel.querySelector('.card-nav-actions')?.before(e);

    if(review?.textContent.startsWith('複習已略過的問題卡')){
